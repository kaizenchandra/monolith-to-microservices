# Source: strangler/templates/apps.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: catalog }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: strangler/catalog:local
          ports: [ { containerPort: 8083 } ]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ ALL ] } }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
          envFrom:
            - configMapRef: { name: commerce }
            - secretRef: { name: catalog-runtime }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: production }
            - name: OUTBOX_ENABLED
              value: "true"
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '2', memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 45
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            failureThreshold: 60
            periodSeconds: 5
      volumes: [ { name: tmp, emptyDir: { } } ]

