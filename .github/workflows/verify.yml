name: Migration verification
on: [ push, pull_request ]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: docker compose up -d --build
      - run: python3 integration-tests/bootstrap.py
      - run: python3 integration-tests/demo.py
      - run: python3 integration-tests/failures.py
      - run: python3 integration-tests/postflight.py
      - if: always()
        run: mkdir -p artifacts && docker compose logs > artifacts/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-evidence
          path: artifacts/
