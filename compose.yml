name: strangler-demo
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-only
    ports: [ "127.0.0.1:55439:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data", "./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d postgres && test \"$$(psql -U demo -d postgres -Atqc 'select version from public.demo_bootstrap_complete')\" = 1" ]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    ports: [ "127.0.0.1:${KAFKA_HOST_PORT:-59092}:9092" ]
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [ "kafkadata:/tmp/kraft-combined-logs" ]
  legacy:
    build:
      context: .
      dockerfile: legacy-monolith/Dockerfile
    image: strangler/legacy:local
    ports: [ "127.0.0.1:28081:8081" ]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xss256k -XX:ActiveProcessorCount=2"
      DB_URL: jdbc:postgresql://postgres:5432/legacymonolith
      DB_USER: legacymonolith_app
      SPRING_FLYWAY_USER: legacymonolith_migrator
      SPRING_FLYWAY_PASSWORD: local-only
      KAFKA_SERVERS: kafka:19092
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OUTBOX_ENABLED: "false"
      LEGACY_URL: http://legacy:8081
      CATALOG_URL: http://catalog:8083
      INVENTORY_URL: http://inventory:8084
      ORDER_URL: http://order:8085
      PAYMENT_URL: http://payment:8086
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
  gateway:
    build:
      context: .
      dockerfile: strangler-gateway/Dockerfile
    image: strangler/gateway:local
    ports: [ "127.0.0.1:28082:8082" ]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xss256k -XX:ActiveProcessorCount=2"
      DB_URL: jdbc:postgresql://postgres:5432/stranglergateway
      DB_USER: stranglergateway_app
      SPRING_FLYWAY_USER: stranglergateway_migrator
      SPRING_FLYWAY_PASSWORD: local-only
      KAFKA_SERVERS: kafka:19092
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OUTBOX_ENABLED: "false"
      LEGACY_URL: http://legacy:8081
      CATALOG_URL: http://catalog:8083
      INVENTORY_URL: http://inventory:8084
      ORDER_URL: http://order:8085
      PAYMENT_URL: http://payment:8086
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
  catalog:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: strangler/catalog:local
    ports: [ "127.0.0.1:28083:8083" ]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xss256k -XX:ActiveProcessorCount=2"
      DB_URL: jdbc:postgresql://postgres:5432/catalogservice
      DB_USER: catalogservice_app
      SPRING_FLYWAY_USER: catalogservice_migrator
      SPRING_FLYWAY_PASSWORD: local-only
      KAFKA_SERVERS: kafka:19092
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OUTBOX_ENABLED: "true"
      LEGACY_URL: http://legacy:8081
      CATALOG_URL: http://catalog:8083
      INVENTORY_URL: http://inventory:8084
      ORDER_URL: http://order:8085
      PAYMENT_URL: http://payment:8086
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
  inventory:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    image: strangler/inventory:local
    ports: [ "127.0.0.1:28084:8084" ]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xss256k -XX:ActiveProcessorCount=2"
      DB_URL: jdbc:postgresql://postgres:5432/inventoryservice
      DB_USER: inventoryservice_app
      SPRING_FLYWAY_USER: inventoryservice_migrator
      SPRING_FLYWAY_PASSWORD: local-only
      KAFKA_SERVERS: kafka:19092
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OUTBOX_ENABLED: "true"
      LEGACY_URL: http://legacy:8081
      CATALOG_URL: http://catalog:8083
      INVENTORY_URL: http://inventory:8084
      ORDER_URL: http://order:8085
      PAYMENT_URL: http://payment:8086
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
  order:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: strangler/order:local
    ports: [ "127.0.0.1:28085:8085" ]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xss256k -XX:ActiveProcessorCount=2"
      DB_URL: jdbc:postgresql://postgres:5432/orderservice
      DB_USER: orderservice_app
      SPRING_FLYWAY_USER: orderservice_migrator
      SPRING_FLYWAY_PASSWORD: local-only
      KAFKA_SERVERS: kafka:19092
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OUTBOX_ENABLED: "true"
      LEGACY_URL: http://legacy:8081
      CATALOG_URL: http://catalog:8083
      INVENTORY_URL: http://inventory:8084
      ORDER_URL: http://order:8085
      PAYMENT_URL: http://payment:8086
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
  payment:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: strangler/payment:local
    ports: [ "127.0.0.1:28086:8086" ]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx128m -Xss256k -XX:ActiveProcessorCount=2"
      DB_URL: jdbc:postgresql://postgres:5432/paymentservice
      DB_USER: paymentservice_app
      SPRING_FLYWAY_USER: paymentservice_migrator
      SPRING_FLYWAY_PASSWORD: local-only
      KAFKA_SERVERS: kafka:19092
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OUTBOX_ENABLED: "true"
      LEGACY_URL: http://legacy:8081
      CATALOG_URL: http://catalog:8083
      INVENTORY_URL: http://inventory:8084
      ORDER_URL: http://order:8085
      PAYMENT_URL: http://payment:8086
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 320M
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: [ "127.0.0.1:${PROMETHEUS_HOST_PORT:-59090}:9090" ]
    volumes: [ "./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./docker/alerts.yml:/etc/prometheus/alerts.yml:ro" ]
  grafana:
    image: grafana/grafana:12.1.1
    ports: [ "127.0.0.1:${GRAFANA_HOST_PORT:-53000}:3000" ]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-only
    volumes: [ "./docker/grafana:/etc/grafana/provisioning:ro" ]
  otel:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: [ "--config=/etc/otel.yml" ]
    volumes: [ "./docker/otel.yml:/etc/otel.yml:ro" ]
volumes:
  pgdata:
  kafkadata:
